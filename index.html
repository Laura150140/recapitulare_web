<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog de produse</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Catalog de produse</h1>
            <p>O aplicatie simpla pentru afisarea si adaugarea produselor.</p>
        </div>
    </header>

    <main class="container">
        <section class="sectiune" aria-labelledby="titlu-formular">
            <h2 id="titlu-formular">Adauga un produs</h2>

            <form id="formular-produs">
                <div class="campuri">
                    <div class="camp">
                        <label for="nume">Numele produsului</label>
                        <input type="text" id="nume" name="nume" maxlength="80" required placeholder="Ex.: Tastatura">
                    </div>
                    <div class="camp">
                        <label for="pret">Pret (USD)</label>
                        <input type="number" id="pret" name="pret" min="0.01" step="0.01" required placeholder="Ex.: 49.99">
                    </div>
                </div>

                <div class="camp">
                    <label for="descriere">Descriere</label>
                    <textarea id="descriere" name="descriere" rows="3" maxlength="300" required placeholder="Cateva detalii despre produs"></textarea>
                </div>

                <button type="submit" id="buton-adaugare">Adauga produsul</button>
                <p id="mesaj-formular" class="mesaj" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section class="sectiune" aria-labelledby="titlu-lista">
            <div class="bara-lista">
                <div>
                    <h2 id="titlu-lista">Lista produselor</h2>
                    <p id="numar-produse" class="text-secundar"></p>
                </div>
                <button type="button" id="buton-reincarcare" class="buton-secundar">Reincarca</button>
            </div>

            <label for="cautare">Cauta un produs dupa nume sau descriere</label>
            <input type="search" id="cautare" name="cautare" placeholder="Scrie ce cauti...">

            <p id="mesaj-lista" class="mesaj" role="status" aria-live="polite"></p>
            <div id="lista-produse" class="lista-produse"></div>
        </section>
    </main>

    <footer>
        <p>Proiect HTML5, CSS si JavaScript - Date de test din DummyJSON - Laura Chincisan</p>
    </footer>
</body>
</html>
